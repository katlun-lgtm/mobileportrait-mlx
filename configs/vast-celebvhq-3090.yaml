# MobilePortrait — 3090 (CUDA) training on 3000 CelebV-HQ clips (pre-extracted PNG frames).
# Fine-tuned from the 320-clip mp40k-best.pth.tar checkpoint via --mp-checkpoint.
# warp_loss=0: confirmed to hurt held-out render_L1 at small dataset scale.
dataset_params:
  root_dir: /workspace/mobileportrait-mlx/data/celebvhq_frames  # train/ + test/ subdirs of clip PNG dirs
  frame_shape: [256, 256, 3]
  id_sampling: False
  augmentation_params:
    flip_param:
      horizontal_flip: True
      time_flip: True
    jitter_param:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.1

model_params:
  common_params:
    num_tps: 10
    num_channels: 3
    bg: True
    multi_mask: True
  generator_params:
    block_expansion: 64
    max_features: 512
    num_down_blocks: 3
  dense_motion_params:
    block_expansion: 64
    max_features: 1024
    num_blocks: 5
    scale_factor: 0.25
  avd_network_params:
    id_bottle_size: 128
    pose_bottle_size: 128

train_params:
  num_epochs: 150               # 3000 clips / BS16 = 188 steps/epoch × 150 = 28125 steps (~2.3h)
  num_repeats: 1
  epoch_milestones: [100, 135]
  lr_generator: 2.0e-4
  batch_size: 16                # 3090 24GB fits BS16 comfortably at 256px
  scales: [1, 0.5, 0.25, 0.125]
  dataloader_workers: 4
  checkpoint_freq: 1
  dropout_epoch: 80
  dropout_maxp: 0.3
  dropout_startp: 0.1
  dropout_inc_epoch: 20
  bg_start: 5
  transform_params:
    sigma_affine: 0.05
    sigma_tps: 0.005
    points_tps: 5
  loss_weights:
    perceptual: [10, 10, 10, 10, 10]
    equivariance_value: 0        # hurts quality at this scale
    warp_loss: 0                 # hurts quality at this scale
    bg: 10

fk_cache_dir: /workspace/mobileportrait-mlx/data/celebvhq_fk  # pre-extracted FK .npy files

visualizer_params:
  kp_size: 5
  draw_border: True
  colormap: 'gist_rainbow'
